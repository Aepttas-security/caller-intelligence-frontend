apply plugin: 'com.android.application'
apply plugin: 'com.facebook.react'

apply from: file("../../node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle")

def isNewArchEnabled() {
    return project.findProperty("newArchEnabled") == "true"
}

def hermesEnabled() {
    return project.findProperty("hermesEnabled") == "true"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscVariant = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscVariant = 'org.webkit:android-jsc:+'

android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    namespace 'com.aepttas.shield'

    defaultConfig {
        applicationId 'com.aepttas.shield'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName '2.1.0'

        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchEnabled().toString()
        buildConfigField "boolean", "IS_HERMES_ENABLED", hermesEnabled().toString()
        buildConfigField "boolean", "REACT_NATIVE_UNSTABLE_USE_RUNTIME_SCHEDULER_ALWAYS", "false"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    
    sourceSets {
        main {
            java {
                srcDirs += [
                    "build/generated/expo/src/main/java",
                ]
            }
        }
    }
}

dependencies {
    // The version of react-android is now binary-distributed via MavenCentral or MavenLocal
    // and it is configured via the React Native Gradle Plugin.
    implementation("com.facebook.react:react-android")

    if (hermesEnabled()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscVariant
    }

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    
    // Custom dependencies
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.28'

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    
    // JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'

    // WorkManager
    def work_version = "2.9.0"
    implementation "androidx.work:work-runtime:$work_version"
    
    // Flipper dependencies for debug build
    // debugImplementation("com.facebook.flipper:flipper:${rootProject.ext.flipperVersion}")
    // debugImplementation("com.facebook.flipper:flipper-network-plugin:${rootProject.ext.flipperVersion}") {
    //     exclude group:'com.facebook.flipper'
    //     exclude group:'com.squareup.okhttp3'
    // }
    // debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${rootProject.ext.flipperVersion}") {
    //     exclude group:'com.facebook.flipper'
    // }

    addExpoModulesDependencies(delegate, project)
}

generateExpoModulesPackageList()

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
